<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002f32">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Masjid Al Ihsan Kapuih — Digital Information System</title>
  <link rel="stylesheet" href="./styles-v23.css?v=underlay-final-20260923-v23-precision">
</head>
<body>
  <main id="viewport" aria-label="Al Ihsan Digital Information System">
    <section id="stage" class="stage" aria-live="polite">
      <img
        class="master master-underlay"
        src="./assets/dashboard-underlay-active.webp?v=underlay-final-20260923-v23-precision"
        alt=""
        aria-hidden="true"
      >

      <div id="liveDate" class="live live-date"></div>
      <div class="live live-clock" aria-label="Waktu Indonesia Barat">
        <strong id="clockHourMinute" class="clock-hm"></strong>
        <span id="clockSecond" class="clock-sec"></span>
        <span class="clock-wib">WIB</span>
      </div>

      <div id="timeShubuh" class="live prayer-time prayer-shubuh"></div>
      <div id="timeTerbit" class="live prayer-time prayer-terbit"></div>
      <div id="timeDzuhur" class="live prayer-time prayer-dzuhur"></div>
      <div id="timeAshar" class="live prayer-time prayer-ashar"></div>
      <div id="timeMaghrib" class="live prayer-time prayer-maghrib"></div>
      <div id="timeIsya" class="live prayer-time prayer-isya"></div>

      <div id="nextPrayer" class="live next-prayer"></div>
      <div id="countdown" class="live countdown"></div>

      <div id="statusDot" class="status-dot" title="Sistem aktif"></div>
    </section>
  </main>

  <script src="./config-v23.js?v=underlay-final-20260923-v23-precision"></script>
  <script src="./prayer-times.js?v=underlay-final-20260923-v23-precision"></script>
  <script src="./app-v23.js?v=underlay-final-20260923-v23-precision"></script>
</body>
</html>
