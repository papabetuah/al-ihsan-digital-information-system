<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001f21">
  <title>Al Ihsan Digital Information System</title>
  <link rel="manifest" href="./manifest.webmanifest?v=dashboard-final-3">
  <link rel="stylesheet" href="./styles.css?v=dashboard-final-3">
</head>
<body>
<div id="frame">
<div id="app">
  <header class="topbar">
    <section class="brand">
      <img class="brand-logo" src="./assets/logo-masjid-final.png?v=dashboard-final-3" alt="Logo Masjid Al Ihsan">
      <div class="brand-copy">
        <div class="brand-kicker">AL IHSAN DIGITAL INFORMATION SYSTEM</div>
        <h1>Masjid Al Ihsan Kapuih</h1>
        <p>Jalan Kapuih, Kel. Limau Manis, Kec. Pauh, Padang</p>
      </div>
    </section>
    <section class="clock-wrap">
      <div class="clock-date" id="date"></div>
      <div class="clock-main"><b id="time">00:00:00</b><span>WIB</span></div>
      <div class="clock-mode"><i></i><em id="mode">NORMAL</em><i></i></div>
    </section>
  </header>

  <main id="screen"></main>

  <footer>
    <div class="ticker">
      <span>Mohon menjaga kebersihan masjid</span><i></i>
      <span>Ikuti kajian, tahsin, dan kegiatan jamaah</span><i></i>
      <span>Infak membantu operasional & pembangunan masjid</span>
    </div>
    <div class="footer-brand"><span>MEMAKMURKAN MASJID</span><b>MEMBANGUN UMAT</b></div>
  </footer>
</div>
</div>

<script>
(async()=>{const V="dashboard-final-3";if(localStorage.getItem("alihsan-ui-release")!==V){
  try{
    if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}
    if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}
  }catch(e){}
  localStorage.setItem("alihsan-ui-release",V);
}})();
</script>
<script src="./config.js?v=dashboard-final-3"></script>
<script src="./app.js?v=dashboard-final-3"></script>
</body>
</html>
