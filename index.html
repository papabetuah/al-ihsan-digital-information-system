<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002f32">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Masjid Al Ihsan Kapuih — Digital Information System</title>
  <link rel="stylesheet" href="./styles.css?v=tarjih-padang-1">
</head>
<body>
  <main id="viewport" aria-label="Al Ihsan Digital Information System">
    <section id="stage" class="stage" aria-live="polite">
      <img class="master" src="./assets/master-dashboard-approved-final.png?v=tarjih-padang-1" alt="Dashboard Masjid Al Ihsan Kapuih">

      <div id="liveDate" class="live live-date">—</div>
      <div class="live live-clock"><strong id="liveClock">00:00:00</strong><span>WIB</span></div>

      <div id="timeShubuh" class="live prayer-time prayer-shubuh">--:--</div>
      <div id="timeTerbit" class="live prayer-time prayer-terbit">--:--</div>
      <div id="timeDzuhur" class="live prayer-time prayer-dzuhur">--:--</div>
      <div id="timeAshar" class="live prayer-time prayer-ashar">--:--</div>
      <div id="timeMaghrib" class="live prayer-time prayer-maghrib">--:--</div>
      <div id="timeIsya" class="live prayer-time prayer-isya">--:--</div>

      <div id="nextPrayer" class="live next-prayer">Menuju Shubuh</div>
      <div id="countdown" class="live countdown">00:00:00</div>

      <div id="statusDot" class="status-dot" title="Sistem aktif"></div>
    </section>
  </main>
  <script src="./config.js?v=tarjih-padang-1"></script>
  <script src="./app.js?v=tarjih-padang-1"></script>
</body>
</html>
