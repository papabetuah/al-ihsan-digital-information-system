name: Sync Yodeck prayer schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/yodeck-schedule-sync.yml"
      - "scripts/yodeck_schedule_sync.js"
      - "config-v64.js"
      - "prayer-times.js"
      - "pre-azan-playlist-v107.js"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync rolling 14-day Yodeck schedule
        env:
          YODECK_API_TOKEN: ${{ secrets.YODECK_API_TOKEN }}
        run: node scripts/yodeck_schedule_sync.js
      - name: Upload schedule sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodeck-schedule-sync-report
          path: yodeck-schedule-sync-report.json
          retention-days: 7
