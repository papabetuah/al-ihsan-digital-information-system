name: Probe Yodeck audio state

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/yodeck-media-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Yodeck audio state
        env:
          YODECK_API_TOKEN: ${{ secrets.YODECK_API_TOKEN }}
        run: python scripts/yodeck_media_probe.py
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: yodeck-media-probe
          path: yodeck-media-probe.json
          retention-days: 3
