name: Deploy Al Ihsan TV to GitHub Pages
# deployment refresh after Pages activation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build approved construction backlayer
        run: |
          python - <<'PY'
          import base64, glob, hashlib
          from pathlib import Path

          parts = sorted(glob.glob("assets/construction-background-v2.b64.*"))
          if len(parts) != 15:
              raise SystemExit(f"Expected 15 construction backlayer chunks, found {len(parts)}")

          encoded = "".join(Path(p).read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)

          expected_size = 170314
          expected_sha256 = "aa1d28ac3b57e3de49042afd2489273af42f585b60b6c38ff980038c91202e50"
          if len(data) != expected_size:
              raise SystemExit(f"Unexpected backlayer size: {len(data)}")
          if hashlib.sha256(data).hexdigest() != expected_sha256:
              raise SystemExit("Construction backlayer SHA-256 mismatch")

          Path("assets/construction-background-approved-master-v2.webp").write_bytes(data)
          PY
      - name: Build same-origin pre-azan audio bundle
        run: |
          python - <<'PY'
          import time, urllib.request
          from pathlib import Path

          files = {
            "05":"17YGcjHQTyguYvqbcqjbLhoYtVLh8r13h",
            "06":"11VkwxLhqn1p_NLqlp9isCUdVOsIEopZI",
            "07":"14Egsk_ZmBzSC0lRoITG5FF-0HUS4YUsu",
            "08":"1ZMabyJeRvLpZsdo3hHLyw4jfjHqwshDB",
            "09":"1M50Sly0Jw9Gtcpg5-al0A5oXcbs6ql7V",
            "10":"181X6AHZjRFFfleviGu1fwBJvGOrPgYVm",
            "11":"1LoNWqK0lv9OxXsGPhJVTZa7d5qN-feQR",
            "12":"13EKVrXJB7caA6L0crGm-Oiac72yVG-m0",
            "13":"1c0Eu1s7XcWNbZwNbZ1QGftZmzC3hq0Xf",
            "14":"1IccqToOOInp4i6drbLNN-PDWXbx8Onix",
            "15":"11JEhXNGt66LSp8CjDDhIIyqllgAPl1wN",
            "16":"1tri4AndYnMMNY7qkNb1xkfVjZNFXkKA_",
            "17":"1WFd2FOb6CKJ57RCR-jU-ZerZ3ytpth-b",
            "18":"1nou0VvtA0MsbijcbFTaE8acNfe7IOh24",
            "19":"189nVN0M26_CovtDo-8H8u_dgHlYPhX4C",
            "20":"10RGdZDuLQ2-pFw83-gzI2w227JGqlNmB",
            "21":"1e6zTOCDPHOtS4hvtAV4AKyT5CsnSY-yA",
            "22":"1OV5ckszmt8A1E53wVZIwMtre0FX0Aq1h",
            "23":"1z36Nohv9NrgfsryXg29W4F1z8m1tNbDz",
            "24":"1X5iCCE3f9YI5UTToittXiuh-wjVJD3V3",
            "25":"1XAy2pGty9vXoBBaQPnb3bJ9qt0hHDPR2",
            "SUBUH-01":"1eyF4ZphZc-wbFDBbPrAT5VNUixlIS1pj",
            "SUBUH-02":"1d05_JuLsic2SmN-ck6bmpfuYqBiL5h0y",
            "SUBUH-03":"1CHnRfnN0GRPaJP2CWeaGmn3_w5cEuDuT",
            "ZUHUR-01":"1E9ecJpS8vd1ISKSZyPy0rRwrfgD--1CC",
            "ZUHUR-02":"1yugZtpa0MfoJBLZ9Uz3Y3bEY0T3fjqHZ",
            "ZUHUR-03":"1WsBcrkutHVo4yNS9UZSLtGgLQgsLvPsW",
            "ASAR-01":"1zKHi8mPURuj71VOmdLGa_aW67wqvWwX7",
            "ASAR-02":"1vMnP5VSPYQX6xxd0zD2ZPVQ1uL5g9j86",
            "ASAR-03":"1aV5d_5QT218CiAR6yOuFz6NJFsSmUhsi",
            "MAGRIB-01":"1OuijgMA_aZKDXzU76b2dgt-SXKBc1G9a",
            "MAGRIB-02":"1rPYfp16QM5DSkZEOY52Gb_DUmkZIfhWO",
            "MAGRIB-03":"1n1xgDvnfgt70I_YBXsXDJQWsEDHUrmpO",
            "ISYA-01":"1AvOkTylz1nqTyRwRZlzcnpkodSnvBoRO",
            "ISYA-02":"149VHNVJlgbsCJtcrqyizW1vuYqXO0QVY",
            "ISYA-03":"1ELa8rzRYz3qudMGx-pHrCf8nj6UYm-0W",
            "JUMAT-01":"1fcggSnH8nhXdv-h-0hcS7qfosd0Egopz",
            "JUMAT-02":"1UjOwMJkKox0Zjn84UTo-0KlefxatL82q",
            "JUMAT-03":"1JS2bfHaGasR4S_RcXxZ71u6EfROu2atD",
          }

          out = Path("assets/pre-azan-audio")
          out.mkdir(parents=True, exist_ok=True)

          def valid_mp3(blob):
            if len(blob) < 2048:
              return False
            head = blob[:64].lstrip().lower()
            if head.startswith(b"<html") or head.startswith(b"<!doctype"):
              return False
            if blob[:3] == b"ID3":
              return True
            for i in range(min(len(blob)-1, 4096)):
              if blob[i] == 0xFF and (blob[i+1] & 0xE0) == 0xE0:
                return True
            return False

          def fetch_mp3(file_id):
            urls = [
              f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t",
              f"https://drive.google.com/uc?export=download&id={file_id}&confirm=t",
            ]
            last = None
            for attempt in range(3):
              for url in urls:
                try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                    blob = r.read()
                  if valid_mp3(blob):
                    return blob
                  last = RuntimeError(f"non-MP3 response ({len(blob)} bytes)")
                except Exception as e:
                  last = e
              time.sleep(1.5 * (attempt + 1))
            raise RuntimeError(f"download failed: {last}")

          total = 0
          for idx, (key, file_id) in enumerate(files.items(), 1):
            blob = fetch_mp3(file_id)
            path = out / f"{key}.mp3"
            path.write_bytes(blob)
            total += len(blob)
            print(f"[{idx}/{len(files)}] {key}: {len(blob)} bytes")
            time.sleep(0.15)

          print(f"Built {len(files)} local MP3 files, total {total} bytes")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Wait for Pages artifact metadata
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
