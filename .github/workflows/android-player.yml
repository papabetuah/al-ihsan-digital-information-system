name: Build Al Ihsan Native TV Player

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-player :app:assembleDebug --stacktrace

      - name: Prepare install package
        run: |
          mkdir -p dist
          cp android-player/app/build/outputs/apk/debug/app-debug.apk "dist/Masjid-Al-Ihsan-Kapuih-OS-Sholat-Operasional-v2.0.0.apk"
          sha256sum "dist/Masjid-Al-Ihsan-Kapuih-OS-Sholat-Operasional-v2.0.0.apk" > "dist/Masjid-Al-Ihsan-Kapuih-OS-Sholat-Operasional-v2.0.0.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masjid-al-ihsan-kapuih-os-v2.0.0
          path: dist/
          if-no-files-found: error
