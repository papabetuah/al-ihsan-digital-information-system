name: Rebuild Yodeck content

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/yodeck-rebuild.yml"\n      - "scripts/yodeck_rebuild.py"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Yodeck media playlists and dashboard
        env:
          YODECK_API_TOKEN: ${{ secrets.YODECK_API_TOKEN }}
        run: python scripts/yodeck_rebuild.py
      - name: Upload rebuild report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodeck-rebuild-report
          path: yodeck-rebuild-report.json
          retention-days: 3
