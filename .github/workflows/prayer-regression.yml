name: Prayer-time regression

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Majelis Tarjih Padang reference
        run: node tests/prayer-regression.mjs
      - name: Verify pre-azan rotation and silence window
        run: node tests/pre-azan-regression.mjs
      - name: Verify finance dashboard integration
        run: node tests/finance-regression.mjs
