name: Test Yodeck audio local patch

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/yodeck-patch-local-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch one Yodeck audio to local
        env:
          YODECK_API_TOKEN: ${{ secrets.YODECK_API_TOKEN }}
        run: python scripts/yodeck_patch_local_test.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodeck-patch-local-test
          path: yodeck-patch-local-test.json
          retention-days: 2
